[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "villain-profiler"
version = "0.1.0"
description = "Poker hand history analyzer: player stats, opponent archetypes and exploitative advice (post-session review tool)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
ml = ["pandas", "scikit-learn"]
equity = ["eval7"]

[project.scripts]
villain = "villain_profiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
